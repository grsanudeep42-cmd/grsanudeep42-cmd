name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Game
        uses: Platane/snk@v3
        with:
          github_user_name: grsanudeep42-cmd
          outputs: |
            dist/github-snake.svg?color_snake=#aaaaaa&color_dots=#161b22,#333333,#555555,#888888,#cccccc
            dist/github-snake-dark.svg?color_snake=#ffffff&color_dots=#161b22,#222222,#444444,#777777,#aaaaaa

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
